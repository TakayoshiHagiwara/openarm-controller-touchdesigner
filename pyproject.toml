[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-controller-touchdesigner"
version = "1.0.0"
description = "Control OpenArm v2 from TouchDesigner over OSC through Dora (MuJoCo and hardware)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dora-rs==1.0.1",
    "dora-rs-cli==1.0.1",
    "dora-openarm-kinematics==0.2.3",
    "openarm-control==0.5.0",
    "openarm-mujoco==2.3.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "python-osc>=1.8,<2",
    "pyyaml>=6",
]

[project.optional-dependencies]
sim = ["dora-openarm-mujoco==0.5.1"]
hardware = ["dora-openarm==1.3.0; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
openarm-td-bridge = "bridge:main"
openarm-td-hardware = "hardware_node:main"
openarm-status-monitor = "status_monitor:main"

[tool.setuptools]
py-modules = ["bridge", "hardware_node", "status_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
